<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposal review</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--fg:#1d2330;--muted:#5d6678;--line:#dfe3ea;--accent:#274c77;
--ok:#1b6e4a;--ok-bg:#e1f2ea;--warn:#8a5300;--warn-bg:#fbefd5;--bad:#a1281f;--bad-bg:#f9e1de}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#1a1e27;--fg:#e8ebf1;--muted:#98a1b3;--line:#2c3240;--accent:#8fb4e3;
--ok:#6fcf9f;--ok-bg:#16301f;--warn:#e8b25a;--warn-bg:#33270f;--bad:#f09a92;--bad-bg:#381a17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.05rem;margin:28px 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:0 0 4px}
input,button{font:inherit}
input[type=text],input[type=file]{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.row{display:grid;gap:12px;grid-template-columns:1fr 2fr}
@media(max-width:640px){.row{grid-template-columns:1fr}}
button{padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);border-radius:4px;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#msg{min-height:1.5em;margin:12px 0 0;color:var(--muted)}#msg.bad{color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
td small,.muted{color:var(--muted)}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.85rem}
.ranked{background:var(--ok-bg);color:var(--ok)}
.flagged{background:var(--warn-bg);color:var(--warn)}
.ineligible{background:var(--bad-bg);color:var(--bad)}
.ok{background:var(--ok-bg);color:var(--ok)}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent)}
details table td,details table th{padding:4px 8px;font-size:.9rem}
.clear{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.clear input{flex:1 1 180px}
.note{color:var(--muted);font-size:.9rem;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>Proposal review</h1>
<p class="sub">Upload proposals, extract the facts, and review the ranking. A person makes the award decision.</p>

<section>
<form id="up">
<div class="row">
<div><label for="cat">Category</label><input id="cat" type="text" list="cats" value="Commercial Solar Installation" required><datalist id="cats"></datalist></div>
<div><label for="files">Proposal PDFs</label><input id="files" type="file" accept="application/pdf" multiple></div>
</div>
<div><label for="proposal-texts">Extracted proposal text (optional if PDFs are not used)</label>
<textarea id="proposal-texts" style="width: 100%; padding: 20px;" rows="12" placeholder="Paste each proposal here. Separate proposals with a line such as: --- Proposal A --- or === Proposal 1 ==="></textarea></div>
<div class="actions">
<button type="submit">Upload</button>
<button type="button" id="ext" class="alt" disabled>Extract facts</button>
<button type="button" id="dec" class="alt" disabled>Rank proposals</button>
</div>
</form>
<p id="msg" role="status"></p>
</section>

<section id="upl" hidden></section>
<section id="out" hidden></section>

<p class="note">Flagged proposals are not ranked until a reviewer clears them with a name and a written reason. Every step is written to the audit log.</p>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let runId = null;

async function api(path, opt) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), {status: r.status});
  return j;
}
function say(m, bad) { const e = $("#msg"); e.textContent = m; e.className = bad ? "bad" : ""; }

// optional: needs GET /api/categories (see README of the view)
fetch("/api/categories").then(r => r.json()).then(j => {
  $("#cats").innerHTML = (j.categories || []).map(c => `<option value="${esc(c)}">`).join("");
}).catch(() => {});

$("#up").onsubmit = async e => {
  e.preventDefault();
  try {
    const fd = new FormData();
    fd.append("category", $("#cat").value);
    if ($("#files").files.length) {
      for (const f of $("#files").files) fd.append("files", f);
    } else if (($('#proposal-texts').value || '').trim()) {
      fd.append("proposal_texts", $('#proposal-texts').value);
    }
    say("Uploading…");
    const r = await api("/api/runs", {method: "POST", body: fd});
    runId = r.run_id;
    $("#ext").disabled = false; $("#dec").disabled = true; $("#out").hidden = true;
    say(`Run ${runId}: ${r.ready} readable, ${r.flagged} flagged. Next: extract facts.`);
    $("#upl").hidden = false;
    $("#upl").innerHTML = `<div class="scroll"><table><tr><th>Id</th><th>File</th><th>Status</th><th>Notes</th></tr>` +
      r.proposals.map(p => `<tr><td>${esc(p.proposal_id)}</td><td>${esc(p.filename)}</td>
      <td><span class="b ${p.status === "ok" ? "ok" : "flagged"}">${esc(p.status)}</span></td>
      <td>${esc([p.reason, ...(p.warnings || [])].filter(Boolean).join(" "))}</td></tr>`).join("") + `</table></div>`;
  } catch (err) { say(err.message, true); }
};

$("#ext").onclick = async () => {
  try {
    say("Extracting… this can take a minute.");
    let r;
    try { r = await api(`/api/runs/${runId}/extract`, {method: "POST"}); }
    catch (err) {
      if (err.status !== 409 || !confirm("This run was already extracted. Run extraction again?")) throw err;
      r = await api(`/api/runs/${runId}/extract?force=1`, {method: "POST"});
    }
    $("#dec").disabled = false;
    say(`Extracted ${r.extracted}, failed ${r.failed}, skipped ${r.skipped}. Next: rank proposals.`);
  } catch (err) { say(err.message, true); }
};

$("#dec").onclick = async () => {
  try { render(await api(`/api/runs/${runId}/decide`, {method: "POST"})); say("Ranking ready."); }
  catch (err) { say(err.message, true); }
};

function render(d) {
  const rows = d.ranking.map(r => {
    const x = (d.details || {})[r.proposal] || {};
    const crit = (x.criteria || []).map(c => `<tr><td>${esc(c.label)}</td><td>${esc(c.points)}/${esc(c.weight)}</td><td>` +
      (c.evidence || []).map(e => e.quote ? `“${esc(e.quote)}” <small>page ${esc(e.page ?? "?")}</small>`
        : `<i class="muted">${esc(e.field)}: ${esc(e.status)}</i>`).join("<br>") + `</td></tr>`).join("");
    const checks = (x.checks || []).map(c => `<li>${esc(c.label)}: ${esc(c.outcome)}</li>`).join("");
    const flags = (x.flags || []).map(f => `<li>${esc(f)}</li>`).join("");
    const clear = r.status === "flagged" && x.total != null
      ? `<form class="clear" data-p="${esc(r.proposal)}"><input name="reviewer" placeholder="Your name" required>
         <input name="reason" placeholder="Why these flags are acceptable" required><button>Clear flags</button></form>` : "";
    const score = r.score == null ? "–" : r.score + (r.status === "flagged" ? " (provisional)" : "");
    return `<tr><td>${r.rank ?? "–"}</td><td><b>${esc(r.proposal)}</b><br><small>${esc(x.bidder || "")}</small></td>
      <td><span class="b ${esc(r.status)}">${esc(r.status)}</span></td><td>${esc(score)}</td>
      <td>${esc(r.reason)}<details><summary>Evidence and checks</summary>
      ${flags ? `<p><b>Flags</b></p><ul>${flags}</ul>` : ""}${checks ? `<p><b>Mandatory checks and limits</b></p><ul>${checks}</ul>` : ""}
      ${crit ? `<div class="scroll"><table>${crit}</table></div>` : ""}${clear}</details></td></tr>`;
  }).join("");
  $("#out").hidden = false;
  $("#out").innerHTML = `<h2 style="margin-top:0">Decision ${esc(d.decision)} · criteria v${esc(d.config_version)}</h2>
    <div class="scroll"><table><tr><th>Rank</th><th>Proposal</th><th>Status</th><th>Score</th><th>Reason</th></tr>${rows}</table></div>`;
}

$("#out").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  try {
    await api(`/api/runs/${runId}/clear`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({proposal_id: f.dataset.p, reviewer: f.reviewer.value, reason: f.reason.value})});
    render(await api(`/api/runs/${runId}/decide`, {method: "POST"}));
    say(`Flags cleared for ${f.dataset.p}; ranking updated.`);
  } catch (err) { say(err.message, true); }
});
</script>
</body>
</html>
